<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup | AgriHarvest</title>
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

<div class="login-container">
  <div class="login-card">

    <h2>🌾 Create Account</h2>
    <p class="subtitle">Join AgriHarvest today</p>

    <input type="text" id="newUser" placeholder="Username">

    <div class="password-box">
      <input type="password" id="newPass" placeholder="Password">
      <span onclick="togglePass()">👁</span>
    </div>

    <button onclick="signup()" class="btn">Sign Up</button>

    <p class="switch">
      Already have account? <a href="login.html">Login</a>
    </p>

    <p id="msg" class="error"></p>

  </div>
</div>

<script src="../assets/js/auth.js"></script>

<script>
function togglePass() {
  const pass = document.getElementById("newPass");
  pass.type = pass.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
